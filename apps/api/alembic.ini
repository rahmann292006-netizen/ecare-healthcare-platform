[alembic]
# path to migration scripts
script_location = alembic

# database URL - will be overridden by code using DATABASE_URL env var
sqlalchemy.url = driver://user:pass@localhost/dbname

# version location
version_locations = alembic/versions

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# version table name
version_table = alembic_version

# timezone to use when rendering the date
# within the migration file as well as the filename.
# string value is passed to dateutil.tz.gettz()
# leave blank for local timezone
# timezone =

# max length of characters to apply to the
# "slug" field
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .py and .sql migration files
# to be inserted into the versions directory out of order
# out_of_order = false

# the version output format
# output_version_format = %%(version)s

# the version output module pattern
# output_version_module = %%(version)s

# the SQLAlchemy pool size
# pool_size = 5

# the SQLAlchemy pool recycle time
# pool_recycle = 3600

# logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S